name: Testes e container da API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_NAME: fastapi-app:latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v3
      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Poetry
        run: python -m pip install poetry==2.2.1
      - name: Restaurar cache do Poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-python3.12-poetry2.2.1-${{ hashFiles('poetry.lock') }}
      - name: Instalar dependências
        run: poetry install --no-root --no-interaction
      - name: Executar testes
        run: poetry run pytest
      - name: Construir imagem Docker
        run: docker build -f Dockerfile -t "$IMAGE_NAME" .
      - name: Executar e validar o container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name fastapi-ci -p 127.0.0.1:8000:8000 "$IMAGE_NAME"
          # Aguarda a inicialização; esgotar as tentativas faz o passo falhar.
          curl --fail --silent --show-error --retry 15 --retry-delay 2 \
            --retry-connrefused --retry-max-time 60 --max-time 5 \
            http://127.0.0.1:8000/openapi.json -o /tmp/openapi.json
          # Verifica uma rota real autenticada, e não apenas o processo ativo.
          curl --fail --silent --show-error --max-time 10 \
            -u admin:senha123 http://127.0.0.1:8000/tarefas -o /tmp/tarefas.json
          python -c 'import json; assert json.load(open("/tmp/tarefas.json")) == [], "A listagem inicial deve estar vazia"'
          test "$(docker inspect -f '{{.State.Running}}' fastapi-ci)" = true
      - name: Exibir logs do container
        if: always()
        run: |
          if docker container inspect fastapi-ci > /dev/null 2>&1; then
            docker logs fastapi-ci
          fi
      - name: Remover container de teste
        if: always()
        run: |
          if docker container inspect fastapi-ci > /dev/null 2>&1; then
            docker rm -f fastapi-ci
          fi
